<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apprentice Hours Tracker</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
  h1 { text-align: center; }
  .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
  label { display: block; margin-top: 10px; }
  input, select { width: 100%; padding: 8px; margin-top: 5px; }
  button { margin-top: 15px; padding: 10px; width: 100%; background: #0077cc; color: white; border: none; border-radius: 5px; }
  table { width: 100%; margin-top: 20px; border-collapse: collapse; }
  th, td { padding: 10px; border-bottom: 1px solid #ddd; }
  .delete-btn { background: red; color: white; padding: 5px; border: none; border-radius: 5px; cursor: pointer; }
  #totalHours { font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
  <h1>Apprentice Hours Tracker</h1>

  <label>Date:</label>
  <input type="date" id="date">

  <label>Job / Company:</label>
  <input type="text" id="job">

  <label>Task Type:</label>
  <select id="task">
    <option value="Rough-In">Rough-In</option>
    <option value="Service Work">Service Work</option>
    <option value="Panels">Panels</option>
    <option value="Troubleshooting">Troubleshooting</option>
    <option value="Other">Other</option>
  </select>

  <label>Hours:</label>
  <input type="number" id="hours" step="0.1">

  <button onclick="addEntry()">Add Entry</button>

  <h2>Logged Hours</h2>
  <table id="hoursTable">
    <tr>
      <th>Date</th>
      <th>Job</th>
      <th>Task</th>
      <th>Hours</th>
      <th>Delete</th>
    </tr>
  </table>

  <div id="totalHours">Total Hours: 0</div>

<button onclick="exportCSV()">Export as CSV</button>
  
</div>

<script>
  let entries = JSON.parse(localStorage.getItem("apprenticeHours")) || [];

  function saveEntries() {
    localStorage.setItem("apprenticeHours", JSON.stringify(entries));
  }

  function addEntry() {
    const date = document.getElementById("date").value;
    const job = document.getElementById("job").value;
    const task = document.getElementById("task").value;
    const hours = parseFloat(document.getElementById("hours").value);

    if (!date || !job || !hours) {
      alert("Please fill out all fields.");
      return;
    }

    entries.push({ date, job, task, hours });
    saveEntries();
    renderTable();
  }

  function deleteEntry(index) {
    entries.splice(index, 1);
    saveEntries();
    renderTable();
  }

  function renderTable() {
    const table = document.getElementById("hoursTable");
    table.innerHTML = `
      <tr>
        <th>Date</th>
        <th>Job</th>
        <th>Task</th>
        <th>Hours</th>
        <th>Delete</th>
      </tr>
    `;

    let total = 0;

    entries.forEach((entry, index) => {
      total += entry.hours;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${entry.date}</td>
        <td>${entry.job}</td>
        <td>${entry.task}</td>
        <td>${entry.hours}</td>
        <td><button class="delete-btn" onclick="deleteEntry(${index})">X</button></td>
      `;
      table.appendChild(row);
    });

    document.getElementById("totalHours").innerText = "Total Hours: " + total;
  }

  renderTable();
</script>

</body>
</html>
