<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apprentice Hours App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <button id="openMenu" class="menu-btn">☰</button>
  <span>Apprentice Hours Tracker</span>
</header>

<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2>Menu</h2>
    <button id="closeMenu">✖</button>
  </div>
  <a href="#" data-section="dashboardSection">📊 Dashboard</a>
  <a href="conduit-fill.htm">Conduit Fill Calculator</a>
  <a href="#" data-section="hoursSection">🕒 Hours Tracker</a>
  <a href="#" data-section="reportSection">🖨 Print Report</a>
  <a href="#" id="toggleDark">🌙 Dark Mode</a>
  <a href="#" id="logout">🚪 Logout</a>
</div>

<div class="container">

  <!-- Login Screen -->
  <div id="loginScreen" class="card">
    <h2>Login</h2>
    <label>Username</label>
    <input id="username" placeholder="Username">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p class="hint">Try: Kevin / electrician</p>
  </div>

  <!-- App Screen -->
  <div id="appScreen" style="display:none;">

    <!-- Dashboard -->
    <div id="dashboardSection" class="card">
      <h2>📊 Dashboard</h2>
      <p id="summaryText"></p>
      <canvas id="weeklyChart"></canvas>
      <canvas id="monthlyChart"></canvas>
    </div>

    <!-- Hours Tracker -->
    <div id="hoursSection" class="card">
      <h2>🕒 Log Your Hours</h2>

      <label>Date</label>
      <input type="date" id="date">

      <label>Job / Company</label>
      <input type="text" id="job">

      <label>Task Type</label>
      <select id="task">
        <option value="Rough-In">Rough-In</option>
        <option value="Service Work">Service Work</option>
        <option value="Panels">Panels</option>
        <option value="Troubleshooting">Troubleshooting</option>
        <option value="Other">Other</option>
      </select>

      <label>Hours</label>
      <input type="number" id="hours" step="0.1">

      <button id="addEntryBtn">Add Entry</button>

      <h3>Logged Hours</h3>
      <table id="hoursTable">
        <tr>
          <th>Date</th>
          <th>Job</th>
          <th>Task</th>
          <th>Hours</th>
          <th>Delete</th>
        </tr>
      </table>

      <div id="totalHours">Total Hours: 0</div>
      <button id="exportCsvBtn">Export as CSV</button>
    </div>

    <!-- Report -->
    <div id="reportSection" class="card">
      <h2>🖨 Printable Report</h2>
      <div id="report"></div>
      <button onclick="window.print()">Print Report</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
