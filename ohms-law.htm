<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ohm's Law Calculator</title>
    <link rel="stylesheet" href="../css/tools.css">
    <script defer src=" ohms-law.js"></script>
</head>

<body>
    <h1>Ohm's Law Calculator</h1>

    <div class="calculator-container">
        <label>Voltage (V):</label>
        <input type="number" id="voltage" placeholder="Leave blank if unknown">

        <label>Current (I):</label>
        <input type="number" id="current" placeholder="Leave blank if unknown">

        <label>Resistance (R):</label>
        <input type="number" id="resistance" placeholder="Leave blank if unknown">

        <label>Power (P):</label>
        <input type="number" id="power" placeholder="Leave blank if unknown">

        <button id="calculateBtn">Calculate</button>
    </div>

    <div id="results" class="results-container"></div>

</body>
</html>
